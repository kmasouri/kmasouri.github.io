<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5fc9"/>
      <stop offset=".45" stop-color="#5a9be6"/>
      <stop offset=".75" stop-color="#a9d0f5"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#8fd14f"/>
      <stop offset=".4" stop-color="#4fa82a"/>
      <stop offset="1" stop-color="#2a6e14"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb63a"/>
      <stop offset="1" stop-color="#2c7516"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#fff" filter="url(#blur)" opacity=".8">
    <ellipse cx="300" cy="180" rx="220" ry="45"/>
    <ellipse cx="420" cy="150" rx="140" ry="50"/>
    <ellipse cx="1100" cy="240" rx="260" ry="40"/>
    <ellipse cx="1250" cy="210" rx="150" ry="45"/>
    <ellipse cx="760" cy="90" rx="180" ry="30"/>
  </g>
  <path d="M-50 720 C 300 560, 700 540, 1000 640 S 1500 760, 1700 700 L1700 1050 L-50 1050 Z" fill="url(#hill2)" opacity=".9"/>
  <path d="M-50 760 C 250 600, 650 560, 980 690 S 1450 900, 1700 820 L1700 1050 L-50 1050 Z" fill="url(#hill)"/>
  <path d="M-50 760 C 250 600, 650 560, 980 690" fill="none" stroke="#c4ef8a" stroke-width="6" opacity=".5" filter="url(#soft)"/>
</svg>
